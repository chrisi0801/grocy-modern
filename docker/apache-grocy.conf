# Apache vHost for the Grocy Modern container image.
# Replaces the default site of the php:*-apache base image.

ServerName grocy
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
	DocumentRoot /var/www/html/public

	# Only `public/` is served. The data directory (SQLite database, uploads,
	# config.php) lives one level above and is therefore not reachable at all.
	<Directory /var/www/html/public>
		Options -Indexes +FollowSymLinks
		AllowOverride All
		Require all granted
	</Directory>

	# Log to stdout/stderr so `docker logs` and `docker compose logs` work.
	# The healthcheck hits /login once a minute - keep that out of the log.
	ErrorLog /dev/stderr
	SetEnvIf Request_URI "^/login$" dontlog
	CustomLog /dev/stdout combined env=!dontlog
</VirtualHost>
